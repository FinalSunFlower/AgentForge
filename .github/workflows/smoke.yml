name: Deployed smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Grey "skipped" until a public URL exists. Do not run the script just to
    # exit 0 — that would paint the same green as a real pass.
    # Job `if` cannot read `secrets` (GitHub rejects the workflow file on push).
    if: ${{ vars.SMOKE_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke client
        run: python -m pip install --upgrade pip && python -m pip install "httpx>=0.28,<1.0"
      - name: Black-box check against public API
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || secrets.SMOKE_BASE_URL }}
        run: python scripts/smoke_test_deployed.py
