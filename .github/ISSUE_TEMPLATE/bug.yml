name: Bug
description: Something in the runtime, console, or evals is wrong
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or route
      placeholder: pytest / GET /v1/evals/summary / playground run
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: No secrets. Rotate leaked keys before filing.
