[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "A controllable tool-augmented agent platform"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.20,<1.0",
  "redis>=5.2,<6.0",
  "httpx>=0.28,<1.0",
  "python-json-logger>=3.2,<4.0",
  "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "opentelemetry-api>=1.29,<2.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1.0",
  "fastembed>=0.5,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
  "fakeredis>=2.26,<3.0",
  "pgserver>=0.1.4,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services/core_api/app", "services/agent_runtime/app", "packages/contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "apps/web/.next", "academic/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM117"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["services", "packages", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-p", "asyncio"]
testpaths = ["tests"]
