services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  core_api:
    profiles: ["stack"]
    build: .
    command: uvicorn services.core_api.app.main:app --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge
      AGENT_RUNTIME_URL: http://runtime:8101
      RUNTIME_INTERNAL_TOKEN: local-runtime-token-change-me
      JWT_SECRET: local-development-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
  runtime:
    profiles: ["stack"]
    build: .
    command: uvicorn services.agent_runtime.app.main:app --host 0.0.0.0 --port 8101
    ports:
      - "8101:8101"
    environment:
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge
      RUNTIME_INTERNAL_TOKEN: local-runtime-token-change-me
    depends_on:
      postgres:
        condition: service_healthy
